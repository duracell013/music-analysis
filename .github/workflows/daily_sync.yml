name: Daily Music Categorization & Sync

on:
  schedule:
    - cron: '12 4 * * *'  # Runs daily at 04:12 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      #- name: Set up Python
      #  uses: actions/setup-python@v5
      #  with:
      #    python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ytm_requirements.txt

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YTM_BROWSER_JSON: ${{ secrets.YTM_BROWSER_JSON }}
        run: python daily_pipeline.py

      - name: Commit Updated Tracks
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update categorized_tracks.jsonl"
          file_pattern: "data/categorized_tracks.jsonl"
